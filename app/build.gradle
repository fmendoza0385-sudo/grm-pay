plugins {
    id 'com.android.application'
}

android {
    namespace 'co.grmconexion.pay'
    compileSdk 34

    defaultConfig {
        applicationId 'co.grmconexion.pay'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Sin dependencias de terceros: solo el WebView y las clases nativas de Android.
